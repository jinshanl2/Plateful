<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to the Fridge</title>
    <style>
       body {
        margin: 0;
        padding: 0;
        height: 200vh;
        overflow-x: hidden;
        }
        .background {
            background-image: url("background01.jpg");
            background-size: cover;
            background-position: 50% 50%;
            height: 255vh;
            font: 900 26rem'';
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            text-align: center;
            overflow: hidden;
        }
        .background::before{
            content: '';
            background-size: cover;
            background-image:inherit;
            background-position: 50% 50%;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            z-index: -99;
        }
        h1{
            position:absolute;
            text-align:center;
            width:100%;
            letter-spacing: 10px;
            color: #fff;
        }
        h2{
            position:absolute;
            letter-spacing: 2px;
            top:120vh;
            width: 60%;
            color: #fff;
            left: 50%;
            transform: translateX(-50%);
            padding:30px;
            background-color: rgba(0,0,0,0.3);
        }
        .button {
            position: absolute;
            display: inline-block;
            text-align: center;
            top: 150vh;
            left: 40%;
            height: 50px;
            width: 200px;
            padding: 10px 20px;
            background-color: #86CEFF;
            color: white;
            font-size: 40px;
            text-decoration: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Hello!<br />(group name)</h1>
    <br>
    <div class="background"><span>Fridge</span></div>
    <h2>
        Welcome to the fridge! This is a place where you can take a photo 
        of your fridge and see what recipes you can make with the ingredients you have. 
    </h2>

    <div style="text-align: center; width: 100%; margin: 0 auto;">
        <a href="main.html" class="button">Start!</a>
    </div>



    <script>
        const background = document.querySelector(".background")
        document.addEventListener('scroll', () => {
            const scroll = window.scrollY

            if(scrollY !== 0){
                background.style.backgroundPosition = `calc(50% + ${scrollY}px) calc(50% + ${scrollY}px)`;
            }else{
                background.style.backgroundPosition = '';
            } 
        });
    </script>

</body>
